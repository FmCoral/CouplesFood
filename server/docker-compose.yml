# 情侣点菜 · 生产编排
# 目标机：阿里云 2C2G（Alibaba Cloud Linux 3），同机运行宝塔面板 + MySQL + 7 个站点
# 原则：只占用 127.0.0.1 上的 3000/5433，绝不碰 80/443/3306

name: couple-menu

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 400m
    memswap_limit: 700m
    environment:
      POSTGRES_USER: couple
      POSTGRES_DB: couple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD}
      # 2C2G 机器：默认 shared_buffers=128MB 偏高，压到 96MB
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=25
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=512MB
      - -c
      - log_min_duration_statement=800
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      # 仅本机可连（运维排查用），不暴露公网；避开宿主机 MySQL 3306
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couple -d couple"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 600m
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0            # 容器内监听全网卡；对外由 ports 限定为 127.0.0.1
      MEDIA_ROOT: /data/images
      BACKUP_DIR: /data/backup
      TZ: Asia/Shanghai
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - ./images:/data/images
      - ./backup:/data/backup
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 备份：每天 03:00 跑一次，全量导出 + 图片打包，只保留 3 份
  # 用独立小容器而不是宿主机 cron，迁移时不丢任务
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: db
      PGUSER: couple
      PGDATABASE: couple
      PGPASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      TZ: Asia/Shanghai
    volumes:
      - ./backup:/backup
      - ./images:/images:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache tzdata >/dev/null 2>&1 || true
        while true; do
          now=$$(date +%s)
          next=$$(date -d 'tomorrow 03:00' +%s)
          sleep $$(( next - now ))
          /bin/sh /usr/local/bin/backup.sh || echo "[backup] failed at $$(date)"
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
