# 模板默认 -Xmx8G / Metaspace 4G 在多数机器上会直接 OOM，收窄到可用区间
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# 本机构建环境（Windows）上 Kotlin 增量编译稳定复现
# "Could not close incremental caches ... class-fq-name-to-source.tab"，
# 导致 :package_info_plus / :image_picker_android / :shared_preferences_android /
# :flutter_image_compress_common 四个子工程的 compileReleaseKotlin 必挂。
# 这是 Kotlin 增量缓存在 Windows 上的已知问题（与文件映射/句柄释放有关），
# 与项目代码无关。关掉增量编译即可：代价是每次全量编译（慢一些），但能出包。
# 换回增量：把下面两行删掉即可。
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
