server
{
    listen 80;
    server_name food.fmcoral.com;
    root /www/wwwroot/food.fmcoral.com;

    # Let's Encrypt 续期验证必须走 HTTP
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /www/wwwroot/food.fmcoral.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/food.fmcoral.com.log;
    error_log   /www/wwwlogs/food.fmcoral.com.error.log;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name food.fmcoral.com;

    # ---- 证书（acme.sh 自动续期后会 reload nginx）----
    ssl_certificate     /www/server/panel/vhost/cert/food.fmcoral.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/food.fmcoral.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # ---- 上传限制：客户端已压缩，8M 足够 ----
    client_max_body_size 8m;
    client_body_timeout  60s;

    # ---- 图片直出：绕过 Node，Nginx 直接读盘 ----
    # 注意 alias 结尾的斜杠不能少，否则 /media/a/b.jpg 会拼错路径
    location /media/ {
        alias /data/couple/images/;
        # 不要同时用 expires 和 add_header Cache-Control：
        # expires 会无条件追加一个 max-age 头，响应里就会出现两条 cache-control。
        # 图片文件名是 UUID、内容永不变化，可以放心长缓存 + immutable。
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- 应用内更新：版本清单 + APK 直出 ----
    # 清单必须每次取新的（客户端靠它判断有没有新版）；
    # APK 文件名带版本号、内容永不变，可以放心长缓存 + immutable。
    # 注意：location 里一旦出现 add_header，server 级的安全头就不再继承，
    # 所以这两个 location 要把 X-Content-Type-Options 补回来。
    location = /dl/latest.json {
        alias /data/couple/releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /dl/ {
        alias /data/couple/releases/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- WebSocket：必须先于 /api/ 匹配（前缀更长，Nginx 按最长前缀选）----
    location /api/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：不要用默认 60s，否则客户端每分重连一次
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ---- 普通 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # ---- 没有网页前端，只有 API ----
    location = / { return 404; }
    location /  { return 404; }

    access_log  /www/wwwlogs/food.fmcoral.com.log;
    error_log   /www/wwwlogs/food.fmcoral.com.error.log;
}
